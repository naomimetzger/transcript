<div id="transcript-editor">
  <div class="viz-row"><button class="btn" id="previous" type="button">Previous</button><span id="page" aria-live="polite"></span><button class="btn" id="next" type="button">Next</button></div>
  <div id="sentences"></div>
  <div class="viz-row"><button class="btn" id="fillers" type="button">Select detected ums</button><button class="btn" id="clear" type="button">Clear</button><button class="btn btn-primary" id="apply" type="button" disabled>Ask to make these cuts</button><span id="count" aria-live="polite"></span></div>
  <p class="text-small text-muted">Drag over words to select them for removal. Click a selected word to restore it. Cuts leave a small buffer to help protect neighboring speech. Check each join; transcripts can miss fillers or mis-time words.</p>
</div>
<style>
#transcript-editor .line{padding:.7rem 0;border-bottom:1px solid var(--border)}
#transcript-editor .line-head{display:flex;align-items:center;gap:.7rem;margin-bottom:.25rem}
#transcript-editor .tokens{line-height:2.2}
#transcript-editor .token{font:inherit;color:var(--foreground);background:transparent;border:0;padding:.14rem .12rem;border-radius:.2rem;user-select:text;-webkit-user-select:text}
#transcript-editor .token[aria-pressed=true]{text-decoration:line-through;background:var(--accent);color:var(--accent-foreground)}
#transcript-editor .viz-row{margin:.8rem 0}
</style>
<script>
(() => {
const root=document.getElementById('transcript-editor');
const payload=__PAYLOAD__;
const words=payload.words;
const sentences=[];let part=[];words.forEach((w,i)=>{part.push(i);if(/[.!?]["']?$/.test(w.t)){sentences.push(part);part=[]}});if(part.length)sentences.push(part);
const initial=window.openai?.widgetState?.modelContent||{};let selected=new Set(Array.isArray(initial.selected)?initial.selected.filter(i=>Number.isInteger(i)&&i>=0&&i<words.length):[]),page=0,anchor=null,suppressClick=false;const size=5;
const el=id=>root.querySelector('#'+id);const stamp=n=>`${Math.floor(n/60)}:${String(Math.floor(n%60)).padStart(2,'0')}`;
function save(){window.openai?.setWidgetState?.({modelContent:{selected:[...selected]},privateContent:{page}}).catch(()=>{})}
function draw(){const list=el('sentences');list.textContent='';for(const group of sentences.slice(page*size,page*size+size)){const line=document.createElement('div');line.className='line';const head=document.createElement('div');head.className='line-head';const time=document.createElement('span');time.className='text-small text-muted';time.textContent=stamp(words[group[0]].s);const button=document.createElement('button');button.type='button';button.className='btn';const all=group.every(i=>selected.has(i));button.textContent=all?'Restore sentence':'Cut sentence';button.onclick=()=>{if(all)group.forEach(i=>selected.delete(i));else group.forEach(i=>selected.add(i));save();draw()};head.append(time,button);const tokens=document.createElement('div');tokens.className='tokens';group.forEach(i=>{const token=document.createElement('span');token.setAttribute('role','button');token.tabIndex=0;token.className='token cursor-interaction';token.dataset.wordIndex=String(i);token.textContent=words[i].t;token.setAttribute('aria-pressed',selected.has(i));token.setAttribute('aria-label',(selected.has(i)?'Restore ':'Cut ')+words[i].t);token.onclick=(event)=>{if(suppressClick){suppressClick=false;return}if(event.shiftKey&&anchor!==null){for(let j=Math.min(anchor,i);j<=Math.max(anchor,i);j++)selected.add(j)}else{selected.has(i)?selected.delete(i):selected.add(i);anchor=i}save();draw()};token.onkeydown=(event)=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();token.click()}};tokens.append(token,' ')});line.append(head,tokens);list.append(line)}el('page').textContent=`${page+1} / ${Math.ceil(sentences.length/size)}`;el('previous').disabled=page===0;el('next').disabled=(page+1)*size>=sentences.length;el('count').textContent=`${selected.size} word${selected.size===1?'':'s'} selected`;el('apply').disabled=!selected.size}
el('previous').onclick=()=>{page=Math.max(0,page-1);draw()};el('next').onclick=()=>{page=Math.min(Math.ceil(sentences.length/size)-1,page+1);draw()};el('clear').onclick=()=>{selected.clear();save();draw()};
el('fillers').onclick=()=>{let found=0;words.forEach((w,i)=>{if(/^(um+|uh+|erm+)[.,!?]?$/i.test(w.t)){selected.add(i);found++}});save();draw();if(!found)el('count').textContent='No ums were detected in this transcript.'};
el('apply').onclick=async()=>{let indexes=[...selected].sort((a,b)=>a-b),groups=[];for(const i of indexes){let g=groups.at(-1);if(g&&g.at(-1)===i-1)g.push(i);else groups.push([i])}const ranges=groups.map(g=>{const rawStart=words[g[0]].s,rawEnd=words[g.at(-1)].e;const guard=Math.min(0.06,Math.max(0,(rawEnd-rawStart)/4));return {start:(rawStart+guard).toFixed(3),end:(rawEnd-guard).toFixed(3),text:g.map(i=>words[i].t).join(' ')}});const prompt='Use the transcript-video-editor skill to cut the following selected passages from this exact source video: '+JSON.stringify(payload.source)+'. Times are seconds in that file. Preserve the rest, export a new MP4, and share it here. Review the joins for clipped words. Selected cuts: '+JSON.stringify(ranges);try{if(!window.openai?.sendFollowUpMessage)throw Error('Unavailable');await window.openai.sendFollowUpMessage({prompt,title:'Apply transcript cuts'})}catch(e){el('count').textContent='Could not send cuts. Tell the assistant which words to remove.'}};
let dragStart=null;
root.addEventListener('pointerdown',event=>{const word=event.target.closest('[data-word-index]');dragStart=word?Number(word.dataset.wordIndex):null});
root.addEventListener('pointerup',event=>{const word=event.target.closest('[data-word-index]');if(dragStart===null||!word){dragStart=null;return}const end=Number(word.dataset.wordIndex);if(end!==dragStart){for(let i=Math.min(dragStart,end);i<=Math.max(dragStart,end);i++)selected.add(i);anchor=dragStart;window.getSelection()?.removeAllRanges();suppressClick=true;setTimeout(()=>{suppressClick=false},0);save();draw()}dragStart=null});
root.addEventListener('mouseup',()=>{const selection=window.getSelection();if(!selection||selection.isCollapsed||!selection.rangeCount)return;const range=selection.getRangeAt(0);if(!root.contains(range.commonAncestorContainer))return;let found=[];root.querySelectorAll('[data-word-index]').forEach(node=>{if(range.intersectsNode(node))found.push(Number(node.dataset.wordIndex))});if(!found.length)return;found.forEach(i=>selected.add(i));anchor=found[0];selection.removeAllRanges();suppressClick=true;setTimeout(()=>{suppressClick=false},0);save();draw()});
window.addEventListener('openai:set_globals',event=>{const state=event.detail?.globals?.widgetState;if(Array.isArray(state?.modelContent?.selected)){selected=new Set(state.modelContent.selected);draw()}});draw();
})();
</script>
